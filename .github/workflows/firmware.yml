# Build the firmware and run the host tests on every push, so nothing has to
# be compiled on a PC. The flashable images and the rendered preview screens
# come out as downloadable artifacts of the run.
name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Game logic
        working-directory: test/host
        run: |
          g++ -std=gnu++17 -O2 -w -DTOYBOX_HOST -I . -I mock -I ../../src \
            -I ../../toybox-core/src test_logic.cpp -o test_logic
          ./test_logic
      - name: Screen previews
        working-directory: test/host
        run: |
          g++ -std=gnu++17 -O2 -w -DTOYBOX_HOST -I . -I mock -I ../../src \
            -I ../../toybox-core/src -I ../../lib/QRCode/src -I ../../lib/miniz/src -I ../../lib/tjpgd/src \
            host_preview.cpp ../../lib/QRCode/src/qrcode.c ../../src/gfx.cpp \
            ../../src/fonts_intl.cpp ../../src/sensors.cpp ../../src/sticky_host.cpp ../../src/sdcard.cpp \
            ../../toybox-core/src/toybox.cpp ../../toybox-core/src/hub.cpp ../../toybox-core/src/epubcore.cpp \
            ../../toybox-core/src/epubcover.cpp -x c ../../lib/tjpgd/src/tjpgd.c -x none \
            ../../lib/miniz/src/toybox_miniz_impl.c \
            ../../toybox-core/src/settings.cpp ../../toybox-core/src/wordle.cpp \
            ../../toybox-core/src/nonogram.cpp ../../toybox-core/src/game2048.cpp \
            ../../toybox-core/src/xo.cpp -o preview
          ./preview | tee preview.log
          # The harness prints its failures and still exits 0.
          ! grep -q "FAIL" preview.log
      - name: Convert previews to PNG
        if: always()
        working-directory: test/host
        run: |
          pip install --quiet pillow
          mkdir -p png
          python -c "import glob,os; from PIL import Image; [Image.open(f).save('png/'+os.path.basename(f)[:-4]+'.png') for f in glob.glob('*.pgm')]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: |
            test/host/png/
            test/host/preview.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet platformio esptool
      - run: sh tools/make_image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            docs/firmware/toybox-*.bin
            docs/firmware/version.json
